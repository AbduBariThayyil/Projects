<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800pt" height="1130pt">
  <defs>
    <style>
      .cut-guide { stroke: #718096; stroke-width: 2.2; stroke-dasharray: 6, 5; fill: none; }
    </style>
  </defs>
  <rect width="800" height="1130" fill="#FFFFFF" />
  
        <!-- Snug Cut Line: 6px around bookshelf -->
