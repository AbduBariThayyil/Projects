<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800pt" height="1130pt">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&amp;family=Quicksand:wght@600;700&amp;display=swap');
      text { font-family: 'Fredoka One', 'Quicksand', 'Nunito', 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 24px; font-weight: bold; fill: #1E293B; text-anchor: middle; }
      .subtitle { font-size: 14px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .cut-guide { stroke: #94A3B8; stroke-width: 1.8; stroke-dasharray: 6, 5; fill: none; }
      .cut-text { font-size: 11px; fill: #64748B; font-weight: bold; }
      .seat-guide { stroke: #94A3B8; stroke-width: 1.5; stroke-dasharray: 5, 4; fill: rgba(255,255,255,0.85); }
      .seat-text { font-size: 11px; fill: #64748B; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="800" height="1130" fill="#FCFDFD" />
  
  <!-- Header Bar -->
  <rect x="25" y="15" width="750" height="75" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="400.0" y="45" class="title">Option 1: 3 Empty Bookshelves (Coloring Version)</text>
  <text x="400.0" y="72" class="subtitle">✂ Cut along dashed lines. Glue all 3 onto chart paper! (5 books will fit in each!)</text>

        <!-- Bookshelf 1 Container with Dotted Cut Line -->
        <rect x="35" y="100" width="730" height="305" rx="14" class="cut-guide" />
        <g transform="translate(50, 116)">
      <text x="0" y="0" class="cut-text">✂ Cut Bookshelf #1</text>
    </g>
        
        <!-- Shelf Outer Frame -->
        <rect x="50" y="128" width="710" height="275" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" />
        
        <!-- Top Shelf Cavity -->
        <rect x="70" y="160" width="670" height="100" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
        
        <!-- Middle Shelf Board -->
        <rect x="60" y="260" width="690" height="20" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" />
        
        <!-- Bottom Shelf Cavity -->
        <rect x="70" y="280" width="670" height="100" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
        
        <!-- Bottom Base Board -->
        <rect x="60" y="380" width="690" height="20" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" />
        
        <!-- Name Badge -->
        <rect x="290" y="132" width="220" height="24" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
        <text x="400" y="149" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">📚 Bookshelf #1 (Glue 5 books here)</text>
        

        <!-- Bookshelf 2 Container with Dotted Cut Line -->
        <rect x="35" y="435" width="730" height="305" rx="14" class="cut-guide" />
        <g transform="translate(50, 451)">
      <text x="0" y="0" class="cut-text">✂ Cut Bookshelf #2</text>
    </g>
        
        <!-- Shelf Outer Frame -->
        <rect x="50" y="463" width="710" height="275" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" />
        
        <!-- Top Shelf Cavity -->
        <rect x="70" y="495" width="670" height="100" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
        
        <!-- Middle Shelf Board -->
        <rect x="60" y="595" width="690" height="20" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" />
        
        <!-- Bottom Shelf Cavity -->
        <rect x="70" y="615" width="670" height="100" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
        
        <!-- Bottom Base Board -->
        <rect x="60" y="715" width="690" height="20" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" />
        
        <!-- Name Badge -->
        <rect x="290" y="467" width="220" height="24" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
        <text x="400" y="484" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">📚 Bookshelf #2 (Glue 5 books here)</text>
        

        <!-- Bookshelf 3 Container with Dotted Cut Line -->
        <rect x="35" y="770" width="730" height="305" rx="14" class="cut-guide" />
        <g transform="translate(50, 786)">
      <text x="0" y="0" class="cut-text">✂ Cut Bookshelf #3</text>
    </g>
        
        <!-- Shelf Outer Frame -->
        <rect x="50" y="798" width="710" height="275" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" />
        
        <!-- Top Shelf Cavity -->
        <rect x="70" y="830" width="670" height="100" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
        
        <!-- Middle Shelf Board -->
        <rect x="60" y="930" width="690" height="20" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" />
        
        <!-- Bottom Shelf Cavity -->
        <rect x="70" y="950" width="670" height="100" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
        
        <!-- Bottom Base Board -->
        <rect x="60" y="1050" width="690" height="20" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" />
        
        <!-- Name Badge -->
        <rect x="290" y="802" width="220" height="24" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
        <text x="400" y="819" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">📚 Bookshelf #3 (Glue 5 books here)</text>
        </svg>