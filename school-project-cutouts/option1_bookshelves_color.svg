<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800pt" height="1130pt">
  <defs>
    <style>
      .cut-guide { stroke: #A0AEC0; stroke-width: 2; stroke-dasharray: 8, 6; fill: none; }
    </style>
  </defs>
  <rect width="800" height="1130" fill="#FFFFFF" />
  
        <!-- Bookshelf 1 Dotted Cut Box -->
        <rect x="25" y="40" width="750" height="320" rx="16" class="cut-guide" />
        
        <!-- Bookshelf Outer Frame -->
        <rect x="40" y="55" width="730" height="290" rx="14" fill="#8D5B4C" stroke="#2D3748" stroke-width="3.5" />
        
        <!-- Big Open Shelf Interior (220px high - plenty of room for books) -->
        <rect x="60" y="75" width="690" height="220" rx="8" fill="#FFF8EE" stroke="#CBD5E1" stroke-width="2" />
        
        <!-- Solid Base Shelf Board -->
        <rect x="50" y="295" width="710" height="25" rx="4" fill="#A76F53" stroke="#2D3748" stroke-width="3" />
        
        <!-- Top Crown Molding -->
        <rect x="35" y="52" width="740" height="18" rx="6" fill="#A76F53" stroke="#2D3748" stroke-width="2.5" />
        

        <!-- Bookshelf 2 Dotted Cut Box -->
        <rect x="25" y="400" width="750" height="320" rx="16" class="cut-guide" />
        
        <!-- Bookshelf Outer Frame -->
        <rect x="40" y="415" width="730" height="290" rx="14" fill="#795548" stroke="#2D3748" stroke-width="3.5" />
        
        <!-- Big Open Shelf Interior (220px high - plenty of room for books) -->
        <rect x="60" y="435" width="690" height="220" rx="8" fill="#FFF3E0" stroke="#CBD5E1" stroke-width="2" />
        
        <!-- Solid Base Shelf Board -->
        <rect x="50" y="655" width="710" height="25" rx="4" fill="#9C786C" stroke="#2D3748" stroke-width="3" />
        
        <!-- Top Crown Molding -->
        <rect x="35" y="412" width="740" height="18" rx="6" fill="#9C786C" stroke="#2D3748" stroke-width="2.5" />
        

        <!-- Bookshelf 3 Dotted Cut Box -->
        <rect x="25" y="760" width="750" height="320" rx="16" class="cut-guide" />
        
        <!-- Bookshelf Outer Frame -->
        <rect x="40" y="775" width="730" height="290" rx="14" fill="#6D4C41" stroke="#2D3748" stroke-width="3.5" />
        
        <!-- Big Open Shelf Interior (220px high - plenty of room for books) -->
        <rect x="60" y="795" width="690" height="220" rx="8" fill="#EFEBE9" stroke="#CBD5E1" stroke-width="2" />
        
        <!-- Solid Base Shelf Board -->
        <rect x="50" y="1015" width="710" height="25" rx="4" fill="#8D6E63" stroke="#2D3748" stroke-width="3" />
        
        <!-- Top Crown Molding -->
        <rect x="35" y="772" width="740" height="18" rx="6" fill="#8D6E63" stroke="#2D3748" stroke-width="2.5" />
        
</svg>