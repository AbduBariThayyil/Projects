<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800pt" height="1130pt">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&amp;family=Quicksand:wght@600;700&amp;display=swap');
      text { font-family: 'Fredoka One', 'Quicksand', 'Nunito', 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 26px; font-weight: bold; fill: #1E293B; text-anchor: middle; }
      .subtitle { font-size: 14px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .cut-guide { stroke: #94A3B8; stroke-width: 1.8; stroke-dasharray: 6, 5; fill: none; }
      .cut-text { font-size: 11px; fill: #64748B; font-weight: bold; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="800" height="1130" fill="#FCFDFD" />
  
  <!-- Header Bar -->
  <rect x="25" y="15" width="750" height="75" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="400.0" y="45" class="title">Option 1: 3 Empty Bookshelves</text>
  <text x="400.0" y="72" class="subtitle">✂ Cut along dashed lines. Glue 5 books onto each bookshelf! (15 ÷ 3 = 5)</text>

        <!-- Bookshelf 1 Container with Dotted Cut Line -->
        <rect x="30" y="100" width="740" height="300" rx="14" class="cut-guide" />
        <g transform="translate(45, 116)">
      <text x="0" y="0" class="cut-text">✂ Cut Bookshelf #1</text>
    </g>
        
        <!-- Shelf Outer Wooden Frame -->
        <rect x="45" y="128" width="720" height="270" rx="14" fill="#8D5B4C" stroke="#1E293B" stroke-width="3" />
        
        <!-- Shelf Cavity (Huge open wooden shelf: 195px high, 660px wide - PLENTY of room for books!) -->
        <rect x="65" y="155" width="680" height="195" rx="8" fill="#FDF6EE" stroke="#CBD5E1" stroke-width="2" />
        
        <!-- Bottom Base Board / Shelf Plank (Solid base for books to stand on) -->
        <rect x="55" y="350" width="700" height="28" rx="4" fill="#A76F53" stroke="#1E293B" stroke-width="2.5" />
        
        <!-- Shelf Guideline (Dashed guide showing 5 book spots) -->
        <line x1="85" y1="348" x2="725" y2="348" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="10,6" />
        
        <!-- Name Badge -->
        <rect x="270" y="130" width="260" height="24" rx="12" fill="#FEF3C7" stroke="#1E293B" stroke-width="1.5" />
        <text x="400" y="147" font-size="13" font-weight="bold" fill="#78350F" text-anchor="middle">📚 Bookshelf #1 — Glue 5 Books Here</text>
        

        <!-- Bookshelf 2 Container with Dotted Cut Line -->
        <rect x="30" y="435" width="740" height="300" rx="14" class="cut-guide" />
        <g transform="translate(45, 451)">
      <text x="0" y="0" class="cut-text">✂ Cut Bookshelf #2</text>
    </g>
        
        <!-- Shelf Outer Wooden Frame -->
        <rect x="45" y="463" width="720" height="270" rx="14" fill="#8D5B4C" stroke="#1E293B" stroke-width="3" />
        
        <!-- Shelf Cavity (Huge open wooden shelf: 195px high, 660px wide - PLENTY of room for books!) -->
        <rect x="65" y="490" width="680" height="195" rx="8" fill="#FDF6EE" stroke="#CBD5E1" stroke-width="2" />
        
        <!-- Bottom Base Board / Shelf Plank (Solid base for books to stand on) -->
        <rect x="55" y="685" width="700" height="28" rx="4" fill="#A76F53" stroke="#1E293B" stroke-width="2.5" />
        
        <!-- Shelf Guideline (Dashed guide showing 5 book spots) -->
        <line x1="85" y1="683" x2="725" y2="683" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="10,6" />
        
        <!-- Name Badge -->
        <rect x="270" y="465" width="260" height="24" rx="12" fill="#FEF3C7" stroke="#1E293B" stroke-width="1.5" />
        <text x="400" y="482" font-size="13" font-weight="bold" fill="#78350F" text-anchor="middle">📚 Bookshelf #2 — Glue 5 Books Here</text>
        

        <!-- Bookshelf 3 Container with Dotted Cut Line -->
        <rect x="30" y="770" width="740" height="300" rx="14" class="cut-guide" />
        <g transform="translate(45, 786)">
      <text x="0" y="0" class="cut-text">✂ Cut Bookshelf #3</text>
    </g>
        
        <!-- Shelf Outer Wooden Frame -->
        <rect x="45" y="798" width="720" height="270" rx="14" fill="#8D5B4C" stroke="#1E293B" stroke-width="3" />
        
        <!-- Shelf Cavity (Huge open wooden shelf: 195px high, 660px wide - PLENTY of room for books!) -->
        <rect x="65" y="825" width="680" height="195" rx="8" fill="#FDF6EE" stroke="#CBD5E1" stroke-width="2" />
        
        <!-- Bottom Base Board / Shelf Plank (Solid base for books to stand on) -->
        <rect x="55" y="1020" width="700" height="28" rx="4" fill="#A76F53" stroke="#1E293B" stroke-width="2.5" />
        
        <!-- Shelf Guideline (Dashed guide showing 5 book spots) -->
        <line x1="85" y1="1018" x2="725" y2="1018" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="10,6" />
        
        <!-- Name Badge -->
        <rect x="270" y="800" width="260" height="24" rx="12" fill="#FEF3C7" stroke="#1E293B" stroke-width="1.5" />
        <text x="400" y="817" font-size="13" font-weight="bold" fill="#78350F" text-anchor="middle">📚 Bookshelf #3 — Glue 5 Books Here</text>
        </svg>