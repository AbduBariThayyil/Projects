          <!-- Headlights -->
          <circle cx="288" cy="155" r="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
          <circle cx="17" cy="155" r="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
          
          <!-- Door line and handles -->
