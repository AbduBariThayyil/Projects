          <!-- Large Windows / Passenger Area with Designated Cut/Paste Targets -->
          <rect x="68" y="48" width="80" height="82" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
          <rect x="162" y="48" width="80" height="82" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
          
          <!-- Seat 1 and Seat 2 dotted targets -->
