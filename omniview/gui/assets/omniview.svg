<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#f38ba8"/>
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="glow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#89b4fa" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#11111b" stop-opacity="0"/>
    </radialGradient>

    <!-- Play Cone Gradient -->
    <linearGradient id="play-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#b4befe"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>

    <!-- Bezel Subtle Fill -->
    <linearGradient id="bezel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#14141e"/>
    </linearGradient>
  </defs>

  <!-- Base Card -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="url(#border-grad)" stroke-width="2.5"/>

  <!-- Subtle Radial Glow behind Display -->
  <circle cx="64" cy="56" r="44" fill="url(#glow)"/>

  <!-- Modern Display Bezel -->
  <rect x="21" y="23" width="86" height="62" rx="12" fill="url(#bezel-grad)" stroke="#45475a" stroke-width="1.8"/>

  <!-- Screen Glass Area -->
  <rect x="25" y="27" width="78" height="54" rx="8" fill="#1e1e2e" stroke="#313244" stroke-width="1"/>

  <!-- TV Stand -->
  <path d="M 50 93 L 78 93 M 64 85 L 64 93" stroke="#6c7086" stroke-width="3" stroke-linecap="round"/>

  <!-- Chromecast Broadcast Waves (Bottom-Left) -->
  <path d="M 33 71 A 8 8 0 0 1 41 79" stroke="#89b4fa" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 33 64 A 15 15 0 0 1 48 79" stroke="#cba6f7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="33" cy="79" r="2.2" fill="#89b4fa"/>

  <!-- Sleek Play Cone / Triangle (Universal Media) -->
  <path d="M 55 42.5 C 55 40.8 56.8 39.8 58.3 40.7 L 76.8 52.2 C 78.2 53.1 78.2 55.1 76.8 56.0 L 58.3 67.5 C 56.8 68.4 55 67.4 55 65.7 Z" fill="url(#play-grad)"/>

  <!-- Media Badge / Sparkle Top-Right -->
  <circle cx="91" cy="37" r="2" fill="#f9e2af"/>
  <circle cx="85" cy="33" r="1.2" fill="#fab387"/>
</svg>